<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Um time momentâneo · Canais URC × Inovação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14273D; --papel:#F7F9FB; --ceu:#EAF1F8; --linha:#D8E2EC; --grafite:#5A6E82;
  --c-cnr:#1F4E79; --c-assessoria:#2F7D5A; --c-portal:#0B7386; --c-loja:#BF6A0F;
  --c-mkt:#7A4FBF; --c-foco:#C2455A; --c-rede:#5C6E31; --c-dxp:#5A6B7D;
  --ativo:var(--c-cnr);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 16px/1.55 Inter,system-ui,sans-serif;color:var(--tinta);background:var(--papel);overflow:hidden}
.slide{position:absolute;inset:0;display:none;padding:56px 72px 72px;background:var(--papel)}
.slide.ativa{display:flex;flex-direction:column}
.slide.tingida{background:linear-gradient(0deg,color-mix(in srgb,var(--ativo) 7%,var(--papel)),color-mix(in srgb,var(--ativo) 7%,var(--papel)))}
.eyebrow{font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--grafite);text-transform:uppercase;margin-bottom:14px}
.eyebrow b{color:var(--ativo)}
h1{font:800 clamp(34px,4.6vw,58px)/1.08 Archivo,sans-serif;letter-spacing:-.01em;max-width:20ch}
h2{font:700 clamp(26px,3.4vw,40px)/1.12 Archivo,sans-serif;letter-spacing:-.01em}
.barra{width:64px;height:6px;border-radius:3px;background:var(--ativo);margin:18px 0 22px}
.lead{font-size:clamp(16px,1.5vw,20px);color:#2B4258;max-width:62ch}
.duas{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;flex:1;min-height:0;align-items:start}
.lista{list-style:none;display:grid;gap:12px;max-width:60ch}
.lista li{padding:12px 16px 12px 18px;background:#fff;border:1px solid var(--linha);border-left:4px solid var(--ativo);border-radius:10px;font-size:15.5px}
.lista li small{display:block;color:var(--grafite);font-size:12.5px;margin-top:2px}
.selo{display:inline-block;font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--grafite);border:1px solid var(--linha);border-radius:99px;padding:3px 10px;background:#fff}
.selo.ui{color:var(--ativo);border-color:color-mix(in srgb,var(--ativo) 40%,#fff)}
.conexao{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.conexao .com{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--grafite);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-block;font:600 11px 'IBM Plex Mono',monospace;color:#fff;border-radius:6px;padding:2px 8px}
.jogada{background:color-mix(in srgb,var(--ativo) 9%,#fff);border:1px solid color-mix(in srgb,var(--ativo) 35%,#fff);border-radius:12px;padding:16px 18px;margin-top:6px}
.jogada .tt{font:700 13px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--ativo);margin-bottom:6px}
.sozinho{display:grid;gap:10px;margin:6px 0 18px;max-width:60ch}
.sozinho p{padding-left:14px;border-left:3px solid var(--linha)}
.sozinho p.forte{border-color:var(--ativo)}
.sozinho b{font-family:Archivo,sans-serif}
.rodape{position:fixed;left:0;right:0;bottom:0;height:5px;background:var(--linha)}
.rodape i{display:block;height:100%;width:0;background:var(--ativo);transition:width .45s ease, background .45s ease}
.contador{position:fixed;right:26px;bottom:16px;font:500 12px 'IBM Plex Mono',monospace;color:var(--grafite)}
.dica{position:fixed;left:26px;bottom:14px;font:400 12px 'IBM Plex Mono',monospace;color:#93A6B8}
#mini{position:fixed;top:26px;right:32px;width:150px;height:150px;z-index:5;transition:opacity .4s}
.semmini #mini{opacity:0;pointer-events:none}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px;margin-top:8px}
.bloco{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:16px 18px}
.bloco h3{font:700 15px Archivo,sans-serif;margin-bottom:6px}
.bloco p,.bloco li{font-size:14px;color:#2B4258}
.bloco ul{padding-left:18px;display:grid;gap:4px}
.num{font:700 30px Archivo,sans-serif;color:var(--ativo)}
.centro{align-items:center;justify-content:center;text-align:center;display:flex}
.capa-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;flex:1}
.legenda-mandala{display:grid;grid-template-columns:repeat(4,auto);gap:8px 14px;justify-content:start;margin-top:16px}
.legenda-mandala span{display:flex;align-items:center;gap:7px;font:500 12.5px 'IBM Plex Mono',monospace;color:#2B4258}
.legenda-mandala i{width:12px;height:12px;border-radius:4px;display:inline-block}
mark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--ativo) 28%,#fff) 0);padding:0 2px}
.assin{font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--grafite);text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{overflow:visible}
  .slide{position:relative;display:flex!important;flex-direction:column;page-break-after:always;height:100vh}
  #mini,.rodape,.contador,.dica{display:none}
}
@media (max-width:900px){
  .slide{padding:32px 24px 64px;overflow:auto}
  .duas,.capa-grid,.grade2{grid-template-columns:1fr;gap:22px}
  #mini{width:92px;height:92px;top:14px;right:14px}
}
</style>
</head>

/* ============ MANDALA ============ */
function criarMandala(el, tam){
  const NS="http://www.w3.org/2000/svg", C=200, R=138, NR=33;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 400 400"); svg.style.width=tam+"px"; svg.style.height=tam+"px";
  const ang=i=>(-90+i*45)*Math.PI/180;
  const pos=i=>[C+R*Math.cos(ang(i)), C+R*Math.sin(ang(i))];
  const gAnel=document.createElementNS(NS,"g");
  gAnel.style.transformOrigin="200px 200px"; gAnel.style.transition="transform .7s cubic-bezier(.4,0,.2,1)";
  svg.appendChild(gAnel);
  const cordas={}, raios={};
  for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){
    const [x1,y1]=pos(i),[x2,y2]=pos(j);
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
    l.setAttribute("stroke","var(--linha)");l.setAttribute("stroke-width","1.4");
    l.style.transition="all .5s"; gAnel.appendChild(l);
    cordas[CANAIS[i].id+"|"+CANAIS[j].id]=l;
  }
  for(let i=0;i<8;i++){
    const [x,y]=pos(i);
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",C);l.setAttribute("y1",C);l.setAttribute("x2",x);l.setAttribute("y2",y);
    l.setAttribute("stroke","var(--linha)");l.setAttribute("stroke-width","1.4");
    l.style.transition="all .5s"; gAnel.appendChild(l);
    raios[CANAIS[i].id]=l;
  }
  const nucleo=document.createElementNS(NS,"g");
  const cc=document.createElementNS(NS,"circle");
  cc.setAttribute("cx",C);cc.setAttribute("cy",C);cc.setAttribute("r","44");
  cc.setAttribute("fill","#fff");cc.setAttribute("stroke","var(--tinta)");cc.setAttribute("stroke-width","2");
  const ct=document.createElementNS(NS,"text");
  ct.setAttribute("x",C);ct.setAttribute("y",C+4);ct.setAttribute("text-anchor","middle");
  ct.setAttribute("style","font:600 13px 'IBM Plex Mono',monospace;fill:var(--tinta)");
  ct.textContent="CLIENTE";
  nucleo.appendChild(cc);nucleo.appendChild(ct);svg.appendChild(nucleo);
  const nos={};
  CANAIS.forEach((c,i)=>{
    const [x,y]=pos(i);
    const g=document.createElementNS(NS,"g");
    g.style.transformOrigin=x+"px "+y+"px";
    g.style.transition="transform .7s cubic-bezier(.4,0,.2,1), opacity .5s";
    const ci=document.createElementNS(NS,"circle");
    ci.setAttribute("cx",x);ci.setAttribute("cy",y);ci.setAttribute("r",NR);
    ci.setAttribute("fill","var("+CORES[c.id]+")");
    ci.setAttribute("stroke","#fff");ci.setAttribute("stroke-width","3");
    const tx=document.createElementNS(NS,"text");
    tx.setAttribute("x",x);tx.setAttribute("y",y+4.5);tx.setAttribute("text-anchor","middle");
    tx.setAttribute("style","font:600 13.5px 'IBM Plex Mono',monospace;fill:#fff");
    tx.textContent=c.sigla;
    g.appendChild(ci);g.appendChild(tx);gAnel.appendChild(g);
    nos[c.id]=g;
  });
  el.appendChild(svg);
  function setFoco(id, parceiros){
    parceiros=parceiros||[];
    const idx=CANAIS.findIndex(c=>c.id===id);
    const rot=idx<0?0:-idx*45;
    gAnel.style.transform="rotate("+rot+"deg)";
    Object.values(nos).forEach(n=>n.style.transform="rotate("+(-rot)+"deg)");
    CANAIS.forEach(c=>{
      const foco=!id||c.id===id, par=parceiros.includes(c.id);
      nos[c.id].style.opacity=(foco||par)?1:.16;
      raios[c.id].setAttribute("stroke", foco&&id?("var("+CORES[id]+")"):"var(--linha)");
      raios[c.id].setAttribute("stroke-width", foco&&id?"2.6":"1.4");
      raios[c.id].style.opacity=(!id||foco)?1:(par?.9:.25);
    });
    for(const k in cordas){
      const [a,b]=k.split("|");
      const ligada=id&&((a===id&&parceiros.includes(b))||(b===id&&parceiros.includes(a)));
      cordas[k].setAttribute("stroke", ligada?("var("+CORES[id]+")"):"var(--linha)");
      cordas[k].setAttribute("stroke-width", ligada?"2.6":"1.4");
      cordas[k].style.opacity=ligada?.95:(id?.18:.7);
    }
  }
  setFoco(null,[]);
  return {setFoco};
}

const palco=document.getElementById("palco");
S.forEach((s,i)=>{
  const sec=document.createElement("section");
  sec.className="slide"+(s.tingida?" tingida":"");
  if(s.canal) sec.style.setProperty("--ativo","var("+CORES[s.canal.id]+")");
  sec.innerHTML=s.html; palco.appendChild(sec); s.el=sec;
});
const legenda=document.getElementById("legenda");
if(legenda) legenda.innerHTML=CANAIS.map(c=>'<span><i style="background:var('+CORES[c.id]+')"></i>'+c.sigla+'</span>').join("");
const mini=criarMandala(document.getElementById("mini"),150);
const grandes=[];
[["mandala-capa",340],["mandala-guia",320],["mandala-omni",320],["mandala-fim",340]].forEach(([id,tam])=>{
  const el=document.getElementById(id); if(el) grandes.push(criarMandala(el,tam));
});
const prog=document.getElementById("prog"), contador=document.getElementById("contador");
let atual=0;
function ir(n){
  atual=Math.max(0,Math.min(S.length-1,n));
  S.forEach((s,i)=>s.el.classList.toggle("ativa",i===atual));
  const s=S[atual];
  document.body.classList.toggle("semmini", !!s.capa);
  const cor=s.canal?("var("+CORES[s.canal.id]+")"):"var(--tinta)";
  prog.style.background=cor; prog.style.width=((atual+1)/S.length*100)+"%";
  contador.textContent=(atual+1)+" / "+S.length;
  mini.setFoco(s.foco,s.par);
  grandes.forEach(m=>m.setFoco(s.foco,s.par));
  location.hash="s"+(atual+1);
}
addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();ir(atual+1);}
  if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();ir(atual-1);}
  if(e.key==="Home")ir(0); if(e.key==="End")ir(S.length-1);
  if(e.key.toLowerCase()==="p"){e.preventDefault();print();}
});
addEventListener("click",e=>{
  if(e.target.closest("a,button,#mini"))return;
  ir(e.clientX>innerWidth/2?atual+1:atual-1);
});
const h=parseInt((location.hash.match(/s(\d+)/)||[])[1]||"1",10);
ir(h-1);
</script>
