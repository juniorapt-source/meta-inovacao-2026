<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Participantes · Carta de Corso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Navegação do painel"></nav>
  <main class="conteudo">
    <h1 class="pagina-titulo">Participantes</h1>
    <p class="pagina-sub">Quem sustenta o plano: guardiões, Comitê, URC e representantes dos núcleos. Compromisso do e-mail: todos os coordenadores em pelo menos uma apresentação por canal; representantes do Comitê em todas.</p>

    <div id="pendencias"></div>
    <div class="grid" style="grid-template-columns:1fr 1fr" id="pessoas"></div>
  </main>
</div>

<script src="data/config.js"></script>
<script src="data/pessoas.js"></script>
<script src="data/urc.js"></script>
<script src="data/plano.js"></script>
<script src="js/calc.js"></script>
<script src="js/core.js"></script>
<script>
(function(){
  montarShell("participantes.html");
  const pend = DB.pessoas.filter(p => p.pendente);
  document.getElementById("pendencias").innerHTML = pend.length
    ? '<div class="aviso" style="margin-bottom:14px"><b>' + pend.length + ' indicação(ões) pendente(s) — CAN-05.</b> ' +
      'Fallback do Nó 2 já aprovado: sem indicação do núcleo, o gestor da iniciativa é o representante. Atualize no Modo edição quando os nomes saírem.</div>'
    : "";

  /* rótulo exibido no card, quando difere do valor cru de "grupo" */
  const TITULO_GRUPO = { "Comitê": "Comitê de Atendimento e Relacionamento da Inovação" };
  /* grupos onde a linha de descrição abaixo do nome fica oculta (Núcleos usa "nucleo" no lugar) */
  const SEM_DESCRICAO = new Set(["Comitê", "UI"]);

  const grupos = [...new Set(DB.pessoas.map(p => p.grupo))];
  const blocos = grupos.map(g =>
    '<section class="card"><h3 style="font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--grafite);margin-bottom:8px">' + esc(TITULO_GRUPO[g] || g) + "</h3>" +
    DB.pessoas.filter(p => p.grupo === g).map(p => {
      const desc = g === "Núcleos" ? (p.nucleo || "") : (SEM_DESCRICAO.has(g) ? "" : (p.papel || ""));
      return '<div style="padding:7px 0;border-bottom:1px solid var(--linha)">' +
        "<b>" + esc(p.nome) + "</b>" + (p.pendente ? ' <span class="chip st-atrasada">pendente</span>' : "") +
        (desc ? '<div style="font-size:12.5px;color:var(--grafite)">' + esc(desc) + "</div>" : "") + "</div>";
    }).join("") +
    "</section>");

  // card da URC — liderança (transversal) + responsáveis por canal, ambos vindos de data/urc.js
  function renderUrc() {
    const lid = DB.urc_lideranca || [];
    const canais = DB.urc_canais || [];
    const comIndicacao = canais.filter(c => c.responsaveis && c.responsaveis.length > 0);
    const operacionais = new Set();
    canais.forEach(c => (c.responsaveis || []).forEach(r => operacionais.add(r.nome)));

    let h = '<section class="card"><h3 style="font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--grafite);margin-bottom:8px">URC</h3>';
    h += lid.map(p =>
      '<div style="padding:7px 0;border-bottom:1px solid var(--linha)"><b>' + esc(p.nome) + "</b>" +
      '<div style="font-size:12.5px;color:var(--grafite)">' + esc(p.papel) + "</div></div>"
    ).join("");

    h += '<h4 style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--grafite);margin:14px 0 6px">' +
      "Responsáveis por canal" +
      '<span style="font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px">— ' +
      comIndicacao.length + " de " + canais.length + " canais com indicação</span></h4>";

    h += canais.map(c => {
      const reps = c.responsaveis || [];
      const conteudo = reps.length
        ? reps.map(r => '<span class="chip pessoa">' + esc(r.nome) + "</span>").join("")
        : '<span class="chip st-janela">aguardando indicação</span>';
      return '<div style="padding:6px 0;border-bottom:1px solid var(--linha)"><b style="font-size:13px">' + esc(c.canal) + "</b>" +
        '<div style="margin-top:4px">' + conteudo + "</div></div>";
    }).join("");

    h += '<div style="font-size:12px;color:var(--grafite);margin-top:10px">' +
      operacionais.size + " responsáveis operacionais indicados ao todo</div>";
    h += "</section>";
    return h;
  }

  // insere o card da URC logo após o Comitê, preservando a posição visual de antes
  const posComite = grupos.indexOf("Comitê");
  blocos.splice(posComite === -1 ? 0 : posComite + 1, 0, renderUrc());

  document.getElementById("pessoas").innerHTML = blocos.join("");

  if (window.matchMedia("(max-width:960px)").matches)
    document.getElementById("pessoas").style.gridTemplateColumns = "1fr";
})();
</script>
</body>
</html>
