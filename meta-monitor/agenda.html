<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agenda dos ciclos · Carta de Corso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
.vista-toggle{display:flex;gap:8px;margin-bottom:12px}
.vista-toggle button{font:600 12px 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:8px 14px;border-radius:0;border:1px solid var(--linha);background:var(--branco);color:var(--tinta);cursor:pointer}
.vista-toggle button.ativo{background:var(--azul);color:var(--branco);border-color:var(--azul)}
.cal-topo{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.cal-titulo{font:600 18px var(--font-sans);text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{padding:6px 12px;font-size:14px}
.cal-cabecalho{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font:600 10.5px 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--grafite);text-align:center;padding:4px 0}
.cal-semana{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--linha);border-left:1px solid var(--linha);border-right:1px solid var(--linha)}
.cal-semana:first-child{border-top:1px solid var(--linha)}
.cal-semana:last-child{border-bottom:1px solid var(--linha)}
.cal-dia{background:var(--branco);min-height:76px;padding:4px 5px;cursor:default;position:relative}
.cal-dia.cal-tem-evento{cursor:pointer}
.cal-dia.cal-tem-evento:hover{background:rgba(43,38,32,.035)}
.cal-dia.cal-fora{background:var(--ceu);color:var(--ink-3)}
.cal-dia.cal-fora .cal-num{color:var(--ink-3)}
.cal-num{font:600 12px 'IBM Plex Mono',monospace}
.cal-dia.cal-hoje{box-shadow:inset 0 0 0 2px var(--azul-claro)}
.cal-dia.cal-hoje .cal-num{color:var(--azul-claro);font-weight:700}
.cal-eventos{display:flex;flex-direction:column;gap:1px}
.cal-faixa{position:absolute;height:14px;line-height:14px;font-size:9.5px;font-weight:700;color:var(--branco);padding:0 5px;overflow:hidden;white-space:nowrap;border-radius:0;z-index:2}
.cal-faixa-c1{background:var(--azul-claro)}
.cal-faixa-c2{background:var(--laranja)}
.cal-faixa-amostra{display:inline-block;width:16px;height:9px;vertical-align:middle}
.cal-faixa-amostra.cal-faixa-c1{background:var(--azul-claro)}
.cal-faixa-amostra.cal-faixa-c2{background:var(--laranja)}
.cal-legenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--grafite);align-items:center}
.cal-detalhe{margin-top:14px;background:var(--branco);border:1px solid var(--linha);border-radius:0;padding:14px 16px;box-shadow:var(--sombra)}
@media (max-width:960px){
  .cal-dia{min-height:56px}
  .cal-faixa{font-size:8.5px}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Navegação do painel"></nav>
  <main class="conteudo">
    <h1 class="pagina-titulo">Agenda dos ciclos</h1>
    <p class="pagina-sub">2 sessões por canal (3h, presencial, grupos reduzidos; DXP em formato reduzido de 2h). Datas entram assim que a URC devolver a grade — Nó 1.</p>

    <div class="legenda-vocab" id="legenda-vocab" aria-label="Legenda de status dos encontros"></div>

    <div id="aviso-no1"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))" id="ciclos"></div>

    <section class="secao">
      <h2>Encontros <span class="hint">preencha data, local e confirmações no Modo edição</span></h2>

      <div class="vista-toggle">
        <button type="button" id="btn-vista-lista" class="ativo">Lista</button>
        <button type="button" id="btn-vista-calendario">Calendário</button>
      </div>

      <div id="vista-lista">
        <div id="encontros"></div>
      </div>

      <div id="vista-calendario" class="card" style="display:none"></div>
    </section>
  </main>
</div>

<script src="data/config.js"></script>
<script src="js/gate.js"></script>
<script src="data/plano.js"></script>
<script src="data/nos.js"></script>
<script src="data/canais.js"></script>
<script src="data/agenda.js"></script>
<script src="js/calc.js"></script>
<script src="js/core.js"></script>
<script src="js/calendario.js"></script>
<script>
(function(){
  const hoje = hojeISO();
  montarShell("agenda.html");

  const can02 = DB.plano.find(a => a.id === "CAN-02");
  if (can02 && can02.status !== "Concluído")
    document.getElementById("aviso-no1").innerHTML =
      '<div class="aviso" style="margin-bottom:14px"><b>Nó 1 pendente:</b> a URC ainda não devolveu a grade (CAN-02). ' +
      'Fallback vigente: qualquer contraproposta serve, desde que o Ciclo 1 comece até ~18/08. Gatilho: ligação gerência-a-gerência.</div>';

  document.getElementById("ciclos").innerHTML = DB.agenda.ciclos.map(c =>
    '<div class="card"><h3 style="font-size:15px">' + esc(c.nome) + "</h3>" +
    '<div class="mono" style="font-size:13px;color:var(--azul);margin:4px 0">' + esc(c.janela) + "</div>" +
    '<div style="font-size:12.5px;color:var(--grafite)">' + esc(c.regra) + (c.obs ? " · " + esc(c.obs) : "") + "</div></div>").join("");

  const porCanal = Object.fromEntries(DB.canais.map(c => [c.id, c]));

  // dia da semana abreviado (pt-BR, minúsculo, 3 letras) ao lado da data — parse local-safe
  // igual ao resto do site (evita o off-by-one de fuso de "new Date(iso)" cru)
  const DIAS_SEMANA_ABREV = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  function diaSemanaAbrev(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return DIAS_SEMANA_ABREV[new Date(y, m - 1, d).getDay()];
  }

  // "agendado" e "confirmado" ficam com a mesma cor (azul) — precisa bater com
  // COR_ENCONTRO de js/calendario.js (a visão Calendário já tratava os dois iguais;
  // a Lista estava caindo os dois no fallback âmbar, cor diferente pro mesmo status
  // dentro da mesma página — bug pego na auditoria de status do plano de melhorias).
  // Função única usada tanto pra colorir as linhas quanto pra montar a legenda.
  function classeEncontro(status) {
    if (status === "realizado") return "st-concluido";
    if (status === "confirmado" || status === "agendado") return "st-andamento";
    return "st-janela";
  }

  // as cores st-* aqui são as mesmas de plano.html/index.html, mas o vocabulário do
  // ENCONTRO (agendado/confirmado, a agendar, realizado) é outro — a legenda deixa
  // isso explícito
  document.getElementById("legenda-vocab").innerHTML =
    "<b>Vocabulário dos encontros nesta página</b>" +
    '<span class="chip ' + classeEncontro("agendado") + '">Agendado/confirmado</span>' +
    '<span class="chip ' + classeEncontro("a agendar") + '">A agendar</span>' +
    '<span class="chip ' + classeEncontro("realizado") + '">Realizado</span>';

  function linhaEncontro(e) {
    const c = porCanal[e.canal];
    const stCls = classeEncontro(e.status);
    return "<tr>" +
      "<td><b>" + esc(c.nome) + '</b><div style="color:var(--grafite);font-size:11.5px">' + esc(c.formato) + "</div></td>" +
      '<td style="font-size:12.5px;color:var(--grafite);max-width:340px">' + c.pauta.slice(0, 2).map(esc).join(" · ") +
        (c.pauta.length > 2 ? " · +" + (c.pauta.length - 2) : "") + "</td>" +
      '<td class="mono" style="font-size:12.5px">' + (e.data ? CALC.fmtBR(e.data) + " (" + diaSemanaAbrev(e.data) + ")" + (e.turno ? " · " + esc(e.turno) : "") + (e.hora ? " " + esc(e.hora) : "") : "—") + "</td>" +
      "<td>" + (e.local ? esc(e.local) : "—") + ' <span style="color:var(--grafite);font-size:11.5px">' + esc(e.modo) + "</span></td>" +
      '<td class="mono" style="font-size:12.5px">' + (e.convidados ? e.confirmados + "/" + e.convidados : "—") + "</td>" +
      '<td><span class="chip ' + stCls + '">' + esc(e.status) + "</span>" + (e.nota ? '<div style="font-size:11px;color:var(--grafite)">' + esc(e.nota) + "</div>" : "") + "</td></tr>";
  }

  // um card por ciclo (título próprio) em vez de uma tabela única com coluna "Ciclo" —
  // a coluna sai porque o bloco já deixa isso implícito
  document.getElementById("encontros").innerHTML = DB.agenda.ciclos.map((c) => {
    const linhas = DB.agenda.encontros.filter((e) => e.ciclo === c.id);
    return '<h3 style="font-size:15px;margin:18px 0 8px">' + esc(c.nome) + "</h3>" +
      '<div class="card" style="padding:0;overflow:auto">' +
        "<table><thead><tr><th>Canal</th><th>Pauta (resumo)</th><th>Data</th><th>Local · modo</th><th>Confirmações</th><th>Status</th></tr></thead>" +
        "<tbody>" + (linhas.length ? linhas.map(linhaEncontro).join("") : '<tr><td colspan="6" style="color:var(--grafite)">Nenhum encontro cadastrado.</td></tr>') + "</tbody></table>" +
      "</div>";
  }).join("");

  /* toggle Lista / Calendário — o calendário só é montado na primeira vez que é aberto */
  const elLista = document.getElementById("vista-lista");
  const elCal = document.getElementById("vista-calendario");
  const btnLista = document.getElementById("btn-vista-lista");
  const btnCal = document.getElementById("btn-vista-calendario");
  let calendarioMontado = false;

  function mostrarLista() {
    elLista.style.display = ""; elCal.style.display = "none";
    btnLista.classList.add("ativo"); btnCal.classList.remove("ativo");
  }
  function mostrarCalendario() {
    elLista.style.display = "none"; elCal.style.display = "";
    btnCal.classList.add("ativo"); btnLista.classList.remove("ativo");
    if (!calendarioMontado) {
      CALENDARIO.montar(elCal, {
        ciclos: DB.agenda.ciclos,
        encontros: DB.agenda.encontros,
        canais: DB.canais,
        nos: DB.nos.nos,
        plano: DB.plano,
        hojeISO: hoje
      });
      calendarioMontado = true;
    }
  }
  btnLista.addEventListener("click", mostrarLista);
  btnCal.addEventListener("click", mostrarCalendario);
})();
</script>
</body>
</html>
