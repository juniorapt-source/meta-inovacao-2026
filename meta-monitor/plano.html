<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plano de ação · Carta de Corso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
/* ordenação clicável nos cabeçalhos da tabela — asc → desc → sem ordenação */
.tabela-ordenavel th[data-key]{cursor:pointer;user-select:none;white-space:nowrap}
.tabela-ordenavel th[data-key]:hover{color:var(--tinta)}
.tabela-ordenavel th[data-key]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tabela-ordenavel th .ord-ind{display:inline-block;margin-left:4px;font-size:9px;color:var(--grafite);width:8px}
.tabela-ordenavel th[data-key].ord-ativo{color:var(--accent)}
.tabela-ordenavel th[data-key].ord-ativo .ord-ind{color:var(--accent)}

/* item 2.2 (mobile) — card empilhado: ID + atividade em cima, frente logo abaixo,
   responsável/prazo/status embaixo. O mecanismo genérico (table.tabela-cards) é de
   css/base.css; a ORDEM dos campos é só desta página (agenda.html não reordena). */
@media (max-width:767px){
  .tabela-ordenavel td:nth-child(1){order:1;font-weight:600}
  .tabela-ordenavel td:nth-child(3){order:2;font-size:14px}
  .tabela-ordenavel td:nth-child(2){order:3;font-size:11.5px;color:var(--grafite)}
  .tabela-ordenavel td:nth-child(4){order:4}
  .tabela-ordenavel td:nth-child(5){order:5}
  .tabela-ordenavel td:nth-child(6){order:6;margin-top:2px}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Navegação do painel"></nav>
  <main class="conteudo">
    <h1 class="pagina-titulo">Plano de ação</h1>
    <p class="pagina-sub">47 ações em 5 frentes. Clique numa linha para ver dependências e a <b>solução proposta</b>: como executar, como monitorar e com qual ferramenta.</p>

    <div class="filtros">
      <select id="f-frente" aria-label="Filtrar por frente"></select>
      <select id="f-status" aria-label="Filtrar por status">
        <option value="">Todos os status</option>
        <option>Concluído</option><option>Em andamento</option><option>Não iniciado</option>
        <option value="__atrasadas">Só atrasadas</option>
        <option value="__vence7">Vencem em 7 dias</option>
        <option value="__janela">Em janela (sem data fixa)</option>
      </select>
      <select id="f-resp" aria-label="Filtrar por responsável"></select>
      <select id="f-cc" aria-label="Filtrar caminho crítico">
        <option value="">Crítico e não crítico</option>
        <option value="cc">Só caminho crítico</option>
      </select>
      <input id="f-busca" type="search" placeholder="Buscar por texto ou ID…" aria-label="Buscar">
    </div>

    <div class="card" style="padding:0;overflow:auto">
      <table class="tabela-ordenavel tabela-cards">
        <thead><tr>
          <th data-key="id" tabindex="0" role="button" aria-sort="none">ID<span class="ord-ind" aria-hidden="true"></span></th>
          <th data-key="frente" tabindex="0" role="button" aria-sort="none">Frente<span class="ord-ind" aria-hidden="true"></span></th>
          <th data-key="atividade" tabindex="0" role="button" aria-sort="none">Atividade<span class="ord-ind" aria-hidden="true"></span></th>
          <th data-key="resp" tabindex="0" role="button" aria-sort="none">Responsável<span class="ord-ind" aria-hidden="true"></span></th>
          <th data-key="prazo" tabindex="0" role="button" aria-sort="none">Prazo<span class="ord-ind" aria-hidden="true"></span></th>
          <th data-key="status" tabindex="0" role="button" aria-sort="none">Status<span class="ord-ind" aria-hidden="true"></span></th>
        </tr></thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
    <p style="color:var(--grafite);font-size:12.5px;margin-top:10px" id="contagem"></p>
  </main>
</div>

<script src="data/config.js"></script>
<script src="js/config.js"></script>
<script src="js/gate.js"></script>
<script src="js/supabase.js"></script>
<script src="data/plano.js"></script>
<script src="data/nos.js"></script>
<script src="data/canais.js"></script>
<script src="data/agenda.js"></script>
<script src="data/projetos.js"></script>
<script src="data/pessoas.js"></script>
<script src="js/calc.js"></script>
<script src="js/status.js"></script>
<script src="js/core.js"></script>
<script src="js/responsaveis.js"></script>
<script src="js/busca.js"></script>
<script src="js/drawer.js"></script>
<script>
(function(){
  const hoje = hojeISO();
  const LIM7 = CALC.somaDias(hoje, 7);
  montarShell("plano.html");

  const selF = document.getElementById("f-frente"), selS = document.getElementById("f-status"),
        selR = document.getElementById("f-resp"), selC = document.getElementById("f-cc"),
        busca = document.getElementById("f-busca"), corpo = document.getElementById("tabela");

  const frentes = [...new Set(DB.plano.map(a => a.frente))];
  selF.innerHTML = '<option value="">Todas as frentes</option>' + frentes.map(f => "<option>" + esc(f) + "</option>").join("");
  const resps = [...new Set(DB.plano.map(a => a.resp))].sort();
  selR.innerHTML = '<option value="">Todos os responsáveis</option>' + resps.map(r => "<option>" + esc(r) + "</option>").join("");

  function ccChip(a){
    if (!a.cc || !a.cc.tipo) return "";
    if (a.cc.tipo === "no") return ' <span class="chip cc">★ Nó ' + a.cc.no + "</span>";
    if (a.cc.tipo === "cadeia") return ' <span class="chip cc">cadeia ' + a.cc.no + "</span>";
    if (a.cc.tipo === "sla") return ' <span class="chip sla">◆ SLA</span>';
    return "";
  }

  // ordenação clicável no cabeçalho — asc → desc → sem ordenação (ordem.chave = null).
  // Não mexe nos filtros: entra só como um sort() em cima da lista já filtrada.
  const CAMPOS_ORDENAVEIS = {
    id: (a) => a.id,
    frente: (a) => a.frente,
    atividade: (a) => a.atividade,
    resp: (a) => a.resp,
    prazo: (a) => a.prazo_iso || "",
    status: (a) => a.status,
  };
  let ordem = { chave: null, dir: null };

  function comparador(a, b) {
    const pega = CAMPOS_ORDENAVEIS[ordem.chave];
    const cmp = String(pega(a)).localeCompare(String(pega(b)), "pt-BR", { numeric: true });
    return ordem.dir === "desc" ? -cmp : cmp;
  }

  function atualizarIndicadoresOrdenacao() {
    document.querySelectorAll("th[data-key]").forEach((th) => {
      const ativo = th.dataset.key === ordem.chave;
      th.classList.toggle("ord-ativo", ativo);
      th.querySelector(".ord-ind").textContent = ativo ? (ordem.dir === "asc" ? "▲" : "▼") : "";
      th.setAttribute("aria-sort", ativo ? (ordem.dir === "asc" ? "ascending" : "descending") : "none");
    });
  }

  function render(){
    const fv = selF.value, sv = selS.value, rv = selR.value, cv = selC.value, q = busca.value.trim().toLowerCase();
    let lista = DB.plano.filter((a) => {
      const atras = CALC.ehAtrasada(a, hoje);
      if (fv && a.frente !== fv) return false;
      if (sv === "__atrasadas") { if (!atras) return false; }
      else if (sv === "__vence7") { if (!(a.prazo_iso && a.status !== "Concluído" && a.prazo_iso >= hoje && a.prazo_iso <= LIM7)) return false; }
      else if (sv === "__janela") { if (!(!a.prazo_iso && a.prazo)) return false; }
      else if (sv && a.status !== sv) return false;
      if (rv && a.resp !== rv) return false;
      if (cv === "cc" && !(a.cc && a.cc.tipo)) return false;
      if (q && !(a.id + " " + a.atividade + " " + a.sub).toLowerCase().includes(q)) return false;
      return true;
    });
    if (ordem.chave) lista = lista.slice().sort(comparador);

    let html = "";
    for (const a of lista) {
      const [cls, rot] = stClass(a, hoje);
      html += '<tr class="clicavel" data-id="' + a.id + '" id="' + a.id + '">' +
        '<td class="mono" style="font-size:12px;white-space:nowrap">' + a.id + ccChip(a) + "</td>" +
        "<td>" + esc(a.frente.replace(/^\d+\.\s*/, "")) + '<div style="color:var(--grafite);font-size:11.5px">' + esc(a.sub) + "</div></td>" +
        "<td>" + esc(a.atividade) + "</td>" +
        '<td data-label="Responsável">' + DRAWER.spanPessoasEmTexto(a.resp) + "</td>" +
        '<td class="mono" data-label="Prazo" style="font-size:12px;white-space:nowrap">' + esc(a.prazo || "—") + "</td>" +
        '<td><span class="chip ' + cls + '">' + rot + "</span></td></tr>";
      html += '<tr class="detalhe" data-det="' + a.id + '" hidden><td colspan="6">' +
        '<div style="margin-bottom:10px;font-size:12.5px"><b style="color:var(--grafite)">Depende de:</b> ' +
        (a.dep.length ? a.dep.map(d => '<a class="mono" href="#' + d + '" data-goto="' + d + '">' + d + "</a>").join(" · ") : "—") + "</div>" +
        '<div class="det-grid">' +
        "<div><b>Como executar</b>" + esc(a.como) + "</div>" +
        "<div><b>Como monitorar</b>" + esc(a.monitor) + "</div>" +
        "<div><b>Ferramenta</b>" + esc(a.ferramenta) + "</div></div></td></tr>";
    }
    corpo.innerHTML = html || '<tr><td colspan="6" style="color:var(--grafite)">Nenhuma ação com esses filtros.</td></tr>';
    document.getElementById("contagem").textContent = lista.length + " de " + DB.plano.length + " ações exibidas.";
    atualizarIndicadoresOrdenacao();
  }

  function alternarOrdenacao(chave) {
    if (ordem.chave !== chave) ordem = { chave: chave, dir: "asc" };
    else if (ordem.dir === "asc") ordem.dir = "desc";
    else ordem = { chave: null, dir: null };
    render();
  }

  document.querySelector("table.tabela-ordenavel thead").addEventListener("click", (e) => {
    const th = e.target.closest("th[data-key]");
    if (th) alternarOrdenacao(th.dataset.key);
  });
  document.querySelector("table.tabela-ordenavel thead").addEventListener("keydown", (e) => {
    const th = e.target.closest("th[data-key]");
    if (!th) return;
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      alternarOrdenacao(th.dataset.key);
    }
  });

  corpo.addEventListener("click", (e) => {
    const goto = e.target.closest("[data-goto]");
    if (goto) { abrir(goto.dataset.goto); return; }
    const tr = e.target.closest("tr.clicavel");
    if (!tr) return;
    const det = corpo.querySelector('[data-det="' + tr.dataset.id + '"]');
    det.hidden = !det.hidden;
  });

  function abrir(id){
    const tr = corpo.querySelector('tr.clicavel[data-id="' + id + '"]');
    if (!tr) return;
    corpo.querySelector('[data-det="' + id + '"]').hidden = false;
    tr.scrollIntoView({ block: "center" });
  }

  [selF, selS, selR, selC].forEach(s => s.addEventListener("change", render));
  busca.addEventListener("input", render);

  // drill-down vindo de outra página (hoje só o Dashboard): ?status= pré-seleciona o
  // filtro de status, ?q= pré-preenche a busca. Vocabulário do parâmetro é o mesmo
  // do dropdown de status desta página, não os valores crus de a.status.
  const STATUS_QUERY_MAP = {
    concluida: "Concluído",
    em_andamento: "Em andamento",
    atrasada: "__atrasadas",
    vence7: "__vence7",
    janela: "__janela",
  };
  function aplicarQuerystring() {
    const params = new URLSearchParams(location.search);
    const statusParam = params.get("status");
    if (statusParam && STATUS_QUERY_MAP[statusParam] !== undefined) selS.value = STATUS_QUERY_MAP[statusParam];
    const qParam = params.get("q");
    if (qParam) busca.value = qParam;
  }

  aplicarQuerystring();
  render();
  if (location.hash) abrir(location.hash.slice(1));
})();
</script>
</body>
</html>
