<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard · Carta de Corso — Unidade de Inovação · Sebrae Nacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
.kpi-largo{grid-column:span 2;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.kpi-largo .kpi-largo-num{min-width:130px}
.kpi-largo .kpi-largo-lista{flex:1;min-width:200px;font-size:12.5px;color:var(--tinta);border-left:1px solid var(--linha);padding-left:16px}
.kpi-largo .kpi-largo-lista div{padding:3px 0}
.kpi-largo .kpi-largo-nota{flex-basis:100%;font-size:11.5px;font-style:italic;color:var(--grafite);border-top:1px solid var(--linha);padding-top:8px;margin-top:2px}
.kpi .sub{font-size:11px;font-style:italic;color:var(--grafite);margin-top:4px}
@media (max-width:960px){ .kpi-largo{grid-column:span 1} }

/* cards de KPI viram links pra plano.html (drill-down) — visual do card intacto,
   só ganham cursor e um hover sutil (mesmo tom de wash já usado em tr.clicavel) */
.kpi.kpi-link{display:block;cursor:pointer}
.kpi.kpi-link:hover{color:inherit;text-decoration:none;background:rgba(43,38,32,.035)}
.kpi.kpi-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* linhas de "Atrasadas agora"/"Próximos 7 dias" também viram links (plano.html?q=ID) */
.linha-acao{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--linha);
  color:inherit;text-decoration:none}
.linha-acao:hover{background:rgba(43,38,32,.035);color:inherit;text-decoration:none}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Navegação do painel"></nav>
  <main class="conteudo">
    <h1 class="pagina-titulo">Dashboard</h1>
    <p class="pagina-sub" id="sub"></p>
    <p class="aviso" id="aviso-fallback" hidden><b>Dados locais</b> — pode haver defasagem. Não consegui falar com o Supabase agora; mostrando a última cópia local (<span class="mono">data/plano.js</span>).</p>
    <p class="frase-contexto" id="frase-contexto"></p>

    <!-- 1º frase de contexto (acima) · 2º timeline dos 7 nós · 3º atrasadas + próximos 7 dias ·
         4º radar de carga · 5º KPIs numéricos · 6º composição do portfólio — ordem por
         urgência decisória (item 2.3 do plano de melhorias); nenhum componente foi removido,
         só reordenado, e todos os cálculos abaixo continuam os mesmos de antes. -->
    <section class="card" aria-label="Trilho do caminho crítico">
      <div class="trilho">
        <div class="linha-base"></div>
        <div class="nos" id="trilho"></div>
      </div>
    </section>

    <div class="grid duas-colunas" id="duas-colunas">
      <section>
        <h2 style="font-size:16px;margin-bottom:10px">Atrasadas agora</h2>
        <div class="card" id="atrasadas"></div>
      </section>
      <section>
        <h2 style="font-size:16px;margin-bottom:10px">Próximos 7 dias</h2>
        <div class="card" id="prox"></div>
      </section>
    </div>

    <section class="secao">
      <h2>Radar de carga <span class="hint">dias com 2+ entregas pendentes</span></h2>
      <div class="card" id="radar"></div>
    </section>

    <section class="secao">
      <div class="grid kpis" id="kpis"></div>
    </section>

    <section class="secao">
      <h2>Composição do portfólio</h2>
      <div class="grid kpis" id="portfolio"></div>
    </section>
  </main>
</div>

<script src="data/config.js"></script>
<script src="js/config.js"></script>
<script src="js/gate.js"></script>
<script src="js/supabase.js"></script>
<script src="js/db-plano.js"></script>
<script src="data/plano.js"></script>
<script src="data/nos.js"></script>
<script src="data/projetos.js"></script>
<script src="js/db-projetos.js"></script>
<script src="js/portfolio.js"></script>
<script src="data/canais.js"></script>
<script src="data/agenda.js"></script>
<script src="data/pessoas.js"></script>
<script src="js/calc.js"></script>
<script src="js/status.js"></script>
<script src="js/core.js"></script>
<script src="js/busca.js"></script>
<script>
(async function(){
  "use strict";
  /* Fonte única pros 5 cards de KPI clicáveis: fecha sobre `plano` (carregado uma vez no
     topo via DB_PLANO.carregar() — item 3.1 do plano de melhorias, Supabase com fallback
     pra data/plano.js) e replica EXATAMENTE os critérios que CALC.kpis usa pra contar
     (js/calc.js), incluindo duas particularidades preservadas de propósito, não
     corrigidas por conta própria:
       - "em_andamento" e "atrasada" NÃO são mutuamente exclusivas: uma ação "Em andamento"
         com prazo_iso vencido aparece nas duas listas, igual já acontece nos dois cards hoje.
       - "em_janela_sem_data" exige !prazo_iso E prazo (texto) preenchido — não só ausência
         de prazo_iso — porque é assim que k.janela já é calculado em CALC.kpis.
     hoje vem de hojeISO() (não de um novo() Date() cru) pra respeitar DB.config.hoje_referencia
     e garantir que a lista bata com o número do card mesmo em modo demo; a comparação em si
     usa Date normalizado pra meia-noite local (evita o off-by-one de fuso do toISOString). */
  function isoParaDataLocal(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d); // meia-noite local, sem componente de fuso
  }
  function getAcoesPorCategoria(plano, categoria) {
    const hojeISOStr = hojeISO();
    const hojeData = isoParaDataLocal(hojeISOStr);
    const limData = isoParaDataLocal(CALC.somaDias(hojeISOStr, 7));
    const dataDe = (a) => a.prazo_iso ? isoParaDataLocal(a.prazo_iso) : null;

    let lista;
    if (categoria === "concluida") {
      lista = plano.filter(a => a.status === "Concluído");
    } else if (categoria === "em_andamento") {
      lista = plano.filter(a => a.status === "Em andamento");
    } else if (categoria === "atrasada") {
      lista = plano.filter(a => a.prazo_iso && a.status !== "Concluído" && dataDe(a) < hojeData);
    } else if (categoria === "vence_7_dias") {
      lista = plano.filter(a => a.prazo_iso && a.status !== "Concluído" && dataDe(a) >= hojeData && dataDe(a) <= limData);
    } else if (categoria === "em_janela_sem_data") {
      lista = plano.filter(a => !a.prazo_iso && a.prazo);
    } else {
      lista = [];
    }

    lista = lista.slice().sort((a, b) =>
      categoria === "em_janela_sem_data" ? a.id.localeCompare(b.id) : (a.prazo_iso || "").localeCompare(b.prazo_iso || ""));
    return lista;
  }

  const hoje = hojeISO();
  montarShell("index.html");

  // item 3.1 do plano de melhorias — PLANO agora vem do Supabase (meta_inovacao_plano_acoes),
  // com data/plano.js como seed/fallback se a rede falhar (DB_PLANO.carregar(), js/db-plano.js).
  const { lista: plano, usandoFallback } = await DB_PLANO.carregar();
  if (usandoFallback) document.getElementById("aviso-fallback").hidden = false;

  document.getElementById("sub").textContent =
    "Visão geral do plano · hoje é " + CALC.fmtBR(hoje) + "/2026. Nós vencidos sem conclusão aparecem em vermelho; fallbacks estão no Caminho crítico.";

  // frase de contexto (item 2.3) — "o que precisa de atenção hoje", logo abaixo do título.
  // Os 3 números vêm de CALC.resumoUrgencia (fonte única, mesma regra usada no Radar de
  // carga/trilho/KPIs abaixo — nada recalculado diferente aqui). Parcelas zeradas somem da
  // frase; o total (N itens) soma as 3, não só as 2 citadas no pedido original, senão N
  // ficaria maior que a soma das partes nomeadas — inconsistência pior que citar a 3ª parte.
  const urgencia = CALC.resumoUrgencia(plano, DB.nos.nos, hoje);
  const totalUrgente = urgencia.atrasadas + urgencia.nosCriticos + urgencia.diasCargaConcentrada;
  const fraseEl = document.getElementById("frase-contexto");
  // "Dashboard orientado à decisão", item 1b — recorte crítico dentro do total de
  // atrasadas: mesmo marcador ★ Nó N (a.cc.tipo==="no") que já vira badge em
  // plano.html/Kanban. Se N=0 o parêntese some (não "0 no caminho crítico" — ruído).
  const atrasadasNoCC = plano.filter((a) => CALC.ehAtrasada(a, hoje) && a.cc && a.cc.tipo === "no").length;
  if (totalUrgente === 0) {
    fraseEl.textContent = "Nenhum item crítico hoje — plano no ritmo.";
    fraseEl.classList.add("zerado");
  } else {
    const partesUrgencia = [];
    if (urgencia.atrasadas) {
      const sufixoCC = atrasadasNoCC ? " (" + atrasadasNoCC + " no caminho crítico)" : "";
      partesUrgencia.push(urgencia.atrasadas + (urgencia.atrasadas === 1 ? " ação atrasada" : " ações atrasadas") + sufixoCC);
    }
    if (urgencia.nosCriticos) partesUrgencia.push(urgencia.nosCriticos + (urgencia.nosCriticos === 1 ? " nó crítico" : " nós críticos"));
    if (urgencia.diasCargaConcentrada) partesUrgencia.push(urgencia.diasCargaConcentrada + (urgencia.diasCargaConcentrada === 1 ? " dia com carga concentrada" : " dias com carga concentrada"));
    fraseEl.textContent = totalUrgente + (totalUrgente === 1 ? " item precisa" : " itens precisam") + " de atenção hoje · " + partesUrgencia.join(" · ");
  }

  // trilho dos nós
  const trilho = document.getElementById("trilho");
  trilho.innerHTML = DB.nos.nos.map(n => {
    const st = CALC.estadoNo(n, plano, hoje);
    return '<a class="no-item no-' + st + '" href="caminho.html#no' + n.no + '" title="' + esc(n.titulo) + '">' +
      '<span class="no-dot">' + n.no + '</span>' +
      '<div class="d mono">' + esc(n.data) + '</div>' +
      '<div class="t">' + esc(n.titulo) + '</div></a>';
  }).join("");

  // kpis — cada card vira um link pra plano.html já filtrado (drill-down nível 1);
  // "ações no plano" vai sem filtro. Vocabulário da querystring é o de plano.html
  // (?status=vence7/janela/atrasada/concluida/em_andamento), não o das chaves internas
  // de getAcoesPorCategoria (vence_7_dias/em_janela_sem_data) — o mapa abaixo traduz.
  const k = CALC.kpis(plano, hoje);
  const atrasadasLista = getAcoesPorCategoria(plano, "atrasada"); // usada aqui só pra colorir o card (alerta)
  const STATUS_QUERY = {
    concluida: "concluida",
    em_andamento: "em_andamento",
    atrasada: "atrasada",
    vence_7_dias: "vence7",
    em_janela_sem_data: "janela",
  };
  const itens = [
    [k.total, "ações no plano", "", null],
    [null, "concluídas", "", "concluida"],
    [null, "em andamento", "", "em_andamento"],
    [null, "atrasadas", atrasadasLista.length ? "alerta" : "", "atrasada"],
    [null, "vencem em 7 dias", "", "vence_7_dias"],
    [null, "em janela (sem data fixa)", "", "em_janela_sem_data"],
  ];

  const kpisHtml = itens.map(([numFixo, rot, cls, cat]) => {
    if (!cat) {
      return '<a class="card kpi kpi-link ' + cls + '" href="plano.html"><div class="n">' + numFixo + '</div><div class="l">' + rot + "</div></a>";
    }
    const lista = cat === "atrasada" ? atrasadasLista : getAcoesPorCategoria(plano, cat);
    const href = "plano.html?status=" + STATUS_QUERY[cat];
    return '<a class="card kpi kpi-link ' + cls + '" href="' + href + '">' +
      '<div class="n">' + lista.length + '</div>' +
      '<div class="l">' + rot + '</div>' +
    '</a>';
  }).join("");

  // cards de portfólio de projetos (calculados a partir de DB.projetos, nada hardcodado).
  // GOVERNANÇA (camada 2): DB.projetos é hidratado do golden record (meta_inovacao_projetos)
  // por js/portfolio.js — espera a hidratação pra renderizar já com o dado vivo (o seed
  // data/projetos.js é só o fallback offline). Ver docs/GOVERNANCA_GOLDEN_RECORD.md.
  if (window.PORTFOLIO) { try { await window.PORTFOLIO.pronto; } catch (e) { /* mantém seed */ } }
  const projetos = DB.projetos || [];
  const nucleosProj = [...new Set(projetos.map(p => p.nucleo))];
  const PLACEHOLDER_RE = /^núcleo de/i; // representante que não é pessoa física (pendência de indicação)
  const gestores = new Set();
  const iniciativasPendentes = [];
  projetos.forEach(p => {
    let pendente = false;
    p.representantes.forEach(r => {
      const nome = r.trim();
      if (!nome) return;
      if (PLACEHOLDER_RE.test(nome)) { pendente = true; return; }
      gestores.add(nome);
    });
    if (pendente) iniciativasPendentes.push(p.iniciativa);
  });
  const totalGestores = gestores.size;
  // mini-breakdown só mostra núcleo com projeto — "Gestão do Conhecimento e Processos" é
  // núcleo válido no whitelist (editor.html/validar_dados.py), mas sem portfólio hoje, então
  // não entra aqui (0 é ruído visual, não informação)
  const porNucleo = nucleosProj.map(n => [n, projetos.filter(p => p.nucleo === n).length]).filter(([, c]) => c > 0);

  // item 2.3: composição do portfólio virou seção própria (6ª, depois dos KPIs numéricos),
  // não mais anexada ao mesmo grid dos 6 cards de status — mesmos dois cards de antes,
  // só num container (#portfolio) separado do #kpis.
  let portfolioHtml = '<div class="card kpi"><div class="n">' + projetos.length + '</div>' +
    '<div class="l">Projetos no portfólio</div><div class="sub">Iniciativas mapeadas pela UI</div></div>';

  portfolioHtml += '<div class="card kpi kpi-largo">' +
    '<div class="kpi-largo-num"><div class="n">' + totalGestores + '</div><div class="l">Gestores de projetos na UI</div>' +
      '<div class="sub">' + totalGestores + " gestores de projetos</div></div>" +
    '<div class="kpi-largo-lista">' + porNucleo.map(([n, c]) => "<div>" + esc(n) + " — " + c + (c === 1 ? " projeto" : " projetos") + "</div>").join("") + "</div>" +
    (iniciativasPendentes.length ? '<div class="kpi-largo-nota">' + iniciativasPendentes.length +
      (iniciativasPendentes.length === 1 ? " iniciativa aguarda" : " iniciativas aguardam") +
      " indicação nominal (" + iniciativasPendentes.map(esc).join(", ") + ").</div>" : "") +
    "</div>";

  document.getElementById("kpis").innerHTML = kpisHtml;
  document.getElementById("portfolio").innerHTML = portfolioHtml;

  // "Dashboard orientado à decisão", item 1a — concentração por responsável dentro de
  // cada dia do Radar. Usa o MESMO campo que o resto do site já usa pra resolver pessoa
  // (a.responsavel_id, canônico desde o P4 — nenhum campo novo). Uma ação com mais de um
  // responsável (ex.: "JR. e Pova", responsavel_id ["jr","pova"]) conta só pro PRIMEIRO
  // da lista — decisão deliberada: contar em dobro deixaria a soma dos parênteses maior
  // que o nº de entregas do dia, parecendo conta errada à primeira vista.
  function nomeResponsavelPrincipal(a) {
    const id = a.responsavel_id && a.responsavel_id[0];
    if (!id) return a.resp || "—";
    const p = (DB.responsaveis || []).find((r) => r.id === id);
    return p ? p.nome : (a.resp || id);
  }
  function concentracaoPorResponsavelHtml(idsDoDia) {
    const contagem = new Map();
    idsDoDia.forEach((id) => {
      const a = plano.find((x) => x.id === id);
      if (!a) return;
      const nome = nomeResponsavelPrincipal(a);
      contagem.set(nome, (contagem.get(nome) || 0) + 1);
    });
    const ordenado = [...contagem.entries()].sort((x, y) => y[1] - x[1]);
    return ordenado.map(([nome, n]) => esc(nome) + " (" + n + ")").join(", ");
  }

  // radar de carga
  const carga = CALC.cargaPorDia(plano).filter(c => c.carga >= 2 && c.iso >= hoje);
  document.getElementById("radar").innerHTML = carga.length
    ? carga.map(c => '<div style="margin:4px 0 10px">' +
        '<div><span class="badge-dia"' + (c.carga >= 3 ? "" : ' style="background:var(--ambar-w);color:var(--ambar)"') + '>' +
        CALC.fmtBR(c.iso) + " · " + c.carga + ' entregas</span> <span class="mono" style="font-size:12px;color:var(--grafite)">' +
        c.ids.join(" · ") + "</span></div>" +
        '<div style="font-size:11px;color:var(--grafite);margin-top:2px">concentradas em: ' + concentracaoPorResponsavelHtml(c.ids) + "</div>" +
      "</div>").join("")
    : '<span style="color:var(--grafite)">Nenhum dia à frente concentra 2+ entregas.</span>';

  // atrasadas — "Dashboard orientado à decisão", item 3: nó crítico primeiro (dentro do
  // grupo, mais antiga primeiro), mesmo comparador de minhas-acoes.html
  // (CALC.comparadorAtrasadas, js/calc.js — não duplicado nas duas páginas).
  const atr = plano.filter(a => CALC.ehAtrasada(a, hoje)).sort(CALC.comparadorAtrasadas);
  document.getElementById("atrasadas").innerHTML = atr.length
    ? atr.map(a => linha(a, true)).join("")
    : '<span style="color:var(--grafite)">Nada atrasado. 👌</span>';

  // próximos 7 dias
  const lim = CALC.somaDias(hoje, 7);
  const prox = plano.filter(a => a.prazo_iso && a.status !== "Concluído" && a.prazo_iso >= hoje && a.prazo_iso <= lim)
                       .sort((a, b) => a.prazo_iso.localeCompare(b.prazo_iso));
  document.getElementById("prox").innerHTML = prox.length ? prox.map(a => linha(a)).join("") : "—";

  // mostrarCC=true (só "Atrasadas agora", item 3) mostra o badge ★ Nó N — window.ccChip
  // (js/core.js), semLink=true porque o chip já fica DENTRO do <a> que envolve a linha
  // inteira (ver comentário logo abaixo) — <a> aninhado dentro de <a> é HTML inválido.
  function linha(a, mostrarCC) {
    const [cls, rot] = stClass(a, hoje);
    // ?q=ID preenche a busca em plano.html (pedido); #ID continua na URL pra também
    // auto-abrir o detalhe da linha lá — os dois mecanismos já existiam separados,
    // isso só junta os dois num link só (o texto da atividade não pode mais ser um
    // <a> aninhado dentro do <a> que agora envolve a linha inteira)
    return '<a class="linha-acao" href="plano.html?q=' + encodeURIComponent(a.id) + '#' + esc(a.id) + '">' +
      '<span class="mono" style="font-size:12px;color:var(--grafite);min-width:58px">' + esc(a.id) + "</span>" +
      '<span style="flex:1">' + esc(a.atividade) +
      ' <span style="color:var(--grafite);font-size:12px">· ' + esc(a.resp) + "</span>" +
      (mostrarCC ? ccChip(a, true) : "") +
      "</span>" +
      '<span class="mono" style="font-size:12px">' + esc(a.prazo) + "</span>" +
      '<span class="chip ' + cls + '">' + rot + "</span></a>";
  }

  // empilhar "Atrasadas agora"/"Próximos 7 dias" em telas estreitas agora é só CSS
  // (.duas-colunas, media query em css/base.css) — o matchMedia + style.gridTemplateColumns
  // daqui saiu de propósito (item 2.5 do plano de melhorias: preferir CSS a JS pra isso).
})();
</script>
</body>
</html>
