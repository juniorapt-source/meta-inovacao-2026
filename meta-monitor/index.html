<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard · Carta de Corso — Unidade de Inovação · Sebrae Nacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
.kpi-largo{grid-column:span 2;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.kpi-largo .kpi-largo-num{min-width:130px}
.kpi-largo .kpi-largo-lista{flex:1;min-width:200px;font-size:12.5px;color:var(--tinta);border-left:1px solid var(--linha);padding-left:16px}
.kpi-largo .kpi-largo-lista div{padding:3px 0}
.kpi-largo .kpi-largo-nota{flex-basis:100%;font-size:11.5px;color:var(--grafite);border-top:1px solid var(--linha);padding-top:8px;margin-top:2px}
.kpi .sub{font-size:11px;color:var(--grafite);margin-top:4px}
@media (max-width:960px){ .kpi-largo{grid-column:span 1} }

/* cards de KPI clicáveis (Concluídas, Em andamento, Atrasadas, Vencem em 7 dias, Em janela) */
.kpi .n.kpi-toggle{cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none;border-radius:6px}
.kpi .n.kpi-toggle:focus-visible{outline:2px solid var(--azul-claro);outline-offset:3px}
.kpi-chevron{font-size:13px;line-height:1;color:var(--grafite);font-weight:600;transition:transform .15s}
.kpi-lista{max-height:0;overflow:hidden;transition:max-height .2s ease}
.kpi-lista-inner{padding-top:10px}
.kpi-item{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--linha);font-size:.85rem;font-family:'Inter',sans-serif}
.kpi-item:first-child{border-top:none}
.kpi-item-id{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--grafite);min-width:54px;flex-shrink:0}
.kpi-item-tit{flex:1;color:var(--tinta);min-width:0}
.kpi-item-data{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--grafite);white-space:nowrap;flex-shrink:0}
.kpi-item-vazio{padding:4px 0;color:var(--grafite);font-size:.85rem}
.kpi-item-nota{color:var(--grafite);font-size:10.5px}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Navegação do painel"></nav>
  <main class="conteudo">
    <h1 class="pagina-titulo">Dashboard</h1>
    <p class="pagina-sub" id="sub"></p>

    <section class="card" aria-label="Trilho do caminho crítico">
      <div class="trilho">
        <div class="linha-base"></div>
        <div class="nos" id="trilho"></div>
      </div>
    </section>

    <section class="secao">
      <div class="grid kpis" id="kpis"></div>
    </section>

    <section class="secao">
      <h2>Radar de carga <span class="hint">dias com 2+ entregas pendentes — distribuir com Sandra e Pova</span></h2>
      <div class="card" id="radar"></div>
    </section>

    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:26px" id="duas-colunas">
      <section>
        <h2 style="font-size:16px;margin-bottom:10px">Atrasadas agora</h2>
        <div class="card" id="atrasadas"></div>
      </section>
      <section>
        <h2 style="font-size:16px;margin-bottom:10px">Próximos 7 dias</h2>
        <div class="card" id="prox"></div>
      </section>
    </div>

    <section class="secao">
      <h2>Atualizações do ambiente</h2>
      <div class="card" id="log"></div>
    </section>
  </main>
</div>

<script src="data/config.js"></script>
<script src="data/plano.js"></script>
<script src="data/nos.js"></script>
<script src="data/changelog.js"></script>
<script src="data/projetos.js"></script>
<script src="js/calc.js"></script>
<script src="js/core.js"></script>
<script>
(function(){
  /* Fonte única pros 5 cards de KPI clicáveis: relê window.DB a cada chamada (sem cache —
     uma edição feita em editor.html precisa aparecer aqui sem refresh) e replica EXATAMENTE
     os critérios que CALC.kpis usa pra contar (js/calc.js), incluindo duas particularidades
     preservadas de propósito, não corrigidas por conta própria:
       - "em_andamento" e "atrasada" NÃO são mutuamente exclusivas: uma ação "Em andamento"
         com prazo_iso vencido aparece nas duas listas, igual já acontece nos dois cards hoje.
       - "em_janela_sem_data" exige !prazo_iso E prazo (texto) preenchido — não só ausência
         de prazo_iso — porque é assim que k.janela já é calculado em CALC.kpis.
     hoje vem de hojeISO() (não de um novo() Date() cru) pra respeitar DB.config.hoje_referencia
     e garantir que a lista bata com o número do card mesmo em modo demo; a comparação em si
     usa Date normalizado pra meia-noite local (evita o off-by-one de fuso do toISOString). */
  function isoParaDataLocal(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d); // meia-noite local, sem componente de fuso
  }
  function getAcoesPorCategoria(categoria) {
    const plano = (window.DB && window.DB.plano) || [];
    const hojeISOStr = hojeISO();
    const hojeData = isoParaDataLocal(hojeISOStr);
    const limData = isoParaDataLocal(CALC.somaDias(hojeISOStr, 7));
    const dataDe = (a) => a.prazo_iso ? isoParaDataLocal(a.prazo_iso) : null;

    let lista;
    if (categoria === "concluida") {
      lista = plano.filter(a => a.status === "Concluído");
    } else if (categoria === "em_andamento") {
      lista = plano.filter(a => a.status === "Em andamento");
    } else if (categoria === "atrasada") {
      lista = plano.filter(a => a.prazo_iso && a.status !== "Concluído" && dataDe(a) < hojeData);
    } else if (categoria === "vence_7_dias") {
      lista = plano.filter(a => a.prazo_iso && a.status !== "Concluído" && dataDe(a) >= hojeData && dataDe(a) <= limData);
    } else if (categoria === "em_janela_sem_data") {
      lista = plano.filter(a => !a.prazo_iso && a.prazo);
    } else {
      lista = [];
    }

    lista = lista.slice().sort((a, b) =>
      categoria === "em_janela_sem_data" ? a.id.localeCompare(b.id) : (a.prazo_iso || "").localeCompare(b.prazo_iso || ""));
    return lista;
  }

  const hoje = hojeISO();
  montarShell("index.html");
  document.getElementById("sub").textContent =
    "Visão geral do plano · hoje é " + CALC.fmtBR(hoje) + "/2026. Nós vencidos sem conclusão aparecem em vermelho; fallbacks estão no Caminho crítico.";

  // trilho dos nós
  const trilho = document.getElementById("trilho");
  trilho.innerHTML = DB.nos.nos.map(n => {
    const st = CALC.estadoNo(n, DB.plano, hoje);
    return '<a class="no-item no-' + st + '" href="caminho.html#no' + n.no + '" title="' + esc(n.titulo) + '">' +
      '<span class="no-dot">' + n.no + '</span>' +
      '<div class="d mono">' + esc(n.data) + '</div>' +
      '<div class="t">' + esc(n.titulo) + '</div></a>';
  }).join("");

  // kpis — total fica sem clique; os outros 5 expandem a lista das ações correspondentes
  const k = CALC.kpis(DB.plano, hoje);
  const atrasadasLista = getAcoesPorCategoria("atrasada"); // usada aqui só pra colorir o card (alerta)
  const itens = [
    [k.total, "ações no plano", "", null],
    [null, "concluídas", "", "concluida"],
    [null, "em andamento", "", "em_andamento"],
    [null, "atrasadas", atrasadasLista.length ? "alerta" : "", "atrasada"],
    [null, "vencem em 7 dias", "", "vence_7_dias"],
    [null, "em janela (sem data fixa)", "", "em_janela_sem_data"],
  ];

  function fmtItemData(a) {
    return a.prazo_iso ? CALC.fmtBR(a.prazo_iso) : "sem data fixa";
  }
  function renderKpiItem(a, sufixo) {
    return '<div class="kpi-item">' +
      '<span class="kpi-item-id">' + esc(a.id) + '</span>' +
      '<span class="kpi-item-tit">' + esc(a.atividade) +
        (sufixo ? ' <span class="kpi-item-nota">· ' + esc(sufixo) + '</span>' : "") + '</span>' +
      '<span class="kpi-item-data">' + esc(fmtItemData(a)) + '</span></div>';
  }

  // "Em andamento" e "Atrasada" se sobrepõem de propósito (ver getAcoesPorCategoria) — sem
  // marca visual, a mesma ação aparecendo em duas listas parece bug. Chama getAcoesPorCategoria
  // das duas categorias uma vez por render de lista (não por item) e devolve uma função de
  // lookup; não reimplementa a regra de sobreposição, só reconsulta a fonte única.
  function sufixoParaCategoria(categoria) {
    if (categoria !== "em_andamento" && categoria !== "atrasada") return () => "";
    const idsEmAndamento = new Set(getAcoesPorCategoria("em_andamento").map((a) => a.id));
    const idsAtrasada = new Set(getAcoesPorCategoria("atrasada").map((a) => a.id));
    return categoria === "em_andamento"
      ? (a) => (idsAtrasada.has(a.id) ? "também atrasada" : "")
      : (a) => (idsEmAndamento.has(a.id) ? "também em andamento" : "");
  }

  let kpisHtml = itens.map(([numFixo, rot, cls, cat]) => {
    if (!cat) {
      return '<div class="card kpi ' + cls + '"><div class="n">' + numFixo + '</div><div class="l">' + rot + "</div></div>";
    }
    const lista = cat === "atrasada" ? atrasadasLista : getAcoesPorCategoria(cat);
    const sufixo = sufixoParaCategoria(cat);
    return '<div class="card kpi ' + cls + '">' +
      '<div class="n kpi-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="kpi-lista-' + cat + '" data-cat="' + cat + '">' +
        lista.length + '<span class="kpi-chevron" aria-hidden="true">▼</span>' +
      '</div>' +
      '<div class="l">' + rot + '</div>' +
      '<div class="kpi-lista" id="kpi-lista-' + cat + '">' +
        '<div class="kpi-lista-inner">' +
          (lista.length ? lista.map((a) => renderKpiItem(a, sufixo(a))).join("") : '<div class="kpi-item-vazio">Nenhuma ação nessa categoria.</div>') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join("");

  // cards de portfólio de projetos (calculados a partir de DB.projetos, nada hardcodado)
  const projetos = DB.projetos || [];
  const nucleosProj = [...new Set(projetos.map(p => p.nucleo))];
  const PLACEHOLDER_RE = /^núcleo de/i; // representante que não é pessoa física (pendência de indicação)
  const gestores = new Set();
  const iniciativasPendentes = [];
  projetos.forEach(p => {
    let pendente = false;
    p.representantes.forEach(r => {
      const nome = r.trim();
      if (!nome) return;
      if (PLACEHOLDER_RE.test(nome)) { pendente = true; return; }
      gestores.add(nome);
    });
    if (pendente) iniciativasPendentes.push(p.iniciativa);
  });
  const totalGestores = gestores.size;
  // mini-breakdown só mostra núcleo com projeto — "Gestão do Conhecimento e Processos" é
  // núcleo válido no whitelist (editor.html/validar_dados.py), mas sem portfólio hoje, então
  // não entra aqui (0 é ruído visual, não informação)
  const porNucleo = nucleosProj.map(n => [n, projetos.filter(p => p.nucleo === n).length]).filter(([, c]) => c > 0);

  kpisHtml += '<div class="card kpi"><div class="n">' + projetos.length + '</div>' +
    '<div class="l">Projetos no portfólio</div><div class="sub">Iniciativas mapeadas pela UI</div></div>';

  kpisHtml += '<div class="card kpi kpi-largo">' +
    '<div class="kpi-largo-num"><div class="n">' + totalGestores + '</div><div class="l">Gestores de projetos na UI</div>' +
      '<div class="sub">' + totalGestores + " gestores de projetos</div></div>" +
    '<div class="kpi-largo-lista">' + porNucleo.map(([n, c]) => "<div>" + esc(n) + " — " + c + (c === 1 ? " projeto" : " projetos") + "</div>").join("") + "</div>" +
    (iniciativasPendentes.length ? '<div class="kpi-largo-nota">' + iniciativasPendentes.length +
      (iniciativasPendentes.length === 1 ? " iniciativa aguarda" : " iniciativas aguardam") +
      " indicação nominal (" + iniciativasPendentes.map(esc).join(", ") + ").</div>" : "") +
    "</div>";

  document.getElementById("kpis").innerHTML = kpisHtml;

  // expand/colapsa dos cards de KPI clicáveis — só um aberto por vez, altura medida via JS
  // (scrollHeight) em vez de um max-height chumbado, pra não capar listas maiores
  (function(){
    const kpisEl = document.getElementById("kpis");
    let abertoCat = null;

    function elementos(cat) {
      return {
        painel: document.getElementById("kpi-lista-" + cat),
        botao: kpisEl.querySelector('.kpi-toggle[data-cat="' + cat + '"]'),
        chevron: kpisEl.querySelector('.kpi-toggle[data-cat="' + cat + '"] .kpi-chevron'),
      };
    }

    function fechar(cat) {
      const { painel, botao, chevron } = elementos(cat);
      if (!painel) return;
      painel.style.maxHeight = painel.scrollHeight + "px"; // trava a altura atual antes de animar até 0
      painel.offsetHeight; // força reflow — sem isso o navegador colapsa a transição num só passo
      requestAnimationFrame(() => { painel.style.maxHeight = "0px"; });
      if (botao) botao.setAttribute("aria-expanded", "false");
      if (chevron) chevron.textContent = "▼";
    }

    // reconstrói o número e a lista do painel a partir de getAcoesPorCategoria NA HORA do
    // clique — é o que garante que uma edição feita em outro lugar (ex.: editor.html mutando
    // window.DB.plano) apareça sem refresh; o HTML montado no carregamento da página é só o
    // primeiro paint, não pode ser o que o clique reexibe
    function renderPainel(cat) {
      const { painel, botao } = elementos(cat);
      if (!painel || !botao) return;
      const lista = getAcoesPorCategoria(cat);
      const sufixo = sufixoParaCategoria(cat);
      const inner = painel.querySelector(".kpi-lista-inner");
      inner.innerHTML = lista.length
        ? lista.map((a) => renderKpiItem(a, sufixo(a))).join("")
        : '<div class="kpi-item-vazio">Nenhuma ação nessa categoria.</div>';
      botao.childNodes[0].textContent = lista.length; // 1º nó = número; 2º nó = chevron (preservado)
    }

    function abrir(cat) {
      renderPainel(cat);
      const { painel, botao, chevron } = elementos(cat);
      if (!painel) return;
      const alvo = painel.scrollHeight;
      painel.style.maxHeight = alvo + "px";
      if (botao) botao.setAttribute("aria-expanded", "true");
      if (chevron) chevron.textContent = "▲";
      painel.addEventListener("transitionend", function onEnd(e) {
        if (e.propertyName !== "max-height") return;
        painel.removeEventListener("transitionend", onEnd);
        if (abertoCat === cat) painel.style.maxHeight = "none"; // altura livre no estado final aberto
      });
    }

    function alternar(cat) {
      if (abertoCat && abertoCat !== cat) fechar(abertoCat);
      if (abertoCat === cat) {
        fechar(cat);
        abertoCat = null;
      } else {
        abrir(cat);
        abertoCat = cat;
      }
    }

    kpisEl.addEventListener("click", (e) => {
      const alvo = e.target.closest(".kpi-toggle");
      if (alvo) alternar(alvo.dataset.cat);
    });
    kpisEl.addEventListener("keydown", (e) => {
      const alvo = e.target.closest(".kpi-toggle");
      if (!alvo) return;
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        alternar(alvo.dataset.cat);
      }
    });
  })();

  // radar de carga
  const carga = CALC.cargaPorDia(DB.plano).filter(c => c.carga >= 2 && c.iso >= hoje);
  document.getElementById("radar").innerHTML = carga.length
    ? carga.map(c => '<div style="margin:4px 0"><span class="badge-dia"' + (c.carga >= 3 ? "" : ' style="background:var(--ambar-w);color:var(--ambar)"') + '>' +
        CALC.fmtBR(c.iso) + " · " + c.carga + ' entregas</span> <span class="mono" style="font-size:12px;color:var(--grafite)">' +
        c.ids.join(" · ") + "</span></div>").join("")
    : '<span style="color:var(--grafite)">Nenhum dia à frente concentra 2+ entregas.</span>';

  // atrasadas
  const atr = DB.plano.filter(a => CALC.ehAtrasada(a, hoje));
  document.getElementById("atrasadas").innerHTML = atr.length
    ? atr.map(a => linha(a)).join("")
    : '<span style="color:var(--grafite)">Nada atrasado. 👌</span>';

  // próximos 7 dias
  const lim = CALC.somaDias(hoje, 7);
  const prox = DB.plano.filter(a => a.prazo_iso && a.status !== "Concluído" && a.prazo_iso >= hoje && a.prazo_iso <= lim)
                       .sort((a, b) => a.prazo_iso.localeCompare(b.prazo_iso));
  document.getElementById("prox").innerHTML = prox.length ? prox.map(a => linha(a)).join("") : "—";

  function linha(a) {
    const [cls, rot] = stClass(a, hoje);
    return '<div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--linha)">' +
      '<span class="mono" style="font-size:12px;color:var(--grafite);min-width:58px">' + esc(a.id) + "</span>" +
      '<span style="flex:1"><a href="plano.html#' + esc(a.id) + '">' + esc(a.atividade) + "</a>" +
      ' <span style="color:var(--grafite);font-size:12px">· ' + esc(a.resp) + "</span></span>" +
      '<span class="mono" style="font-size:12px">' + esc(a.prazo) + "</span>" +
      '<span class="chip ' + cls + '">' + rot + "</span></div>";
  }

  // changelog
  document.getElementById("log").innerHTML = DB.changelog.map(c =>
    '<div style="padding:5px 0"><span class="mono" style="font-size:12px;color:var(--grafite)">' + CALC.fmtBR(c.data) +
    " · v" + esc(c.versao) + "</span> — " + esc(c.nota) + "</div>").join("");

  if (window.matchMedia("(max-width:960px)").matches)
    document.getElementById("duas-colunas").style.gridTemplateColumns = "1fr";
})();
</script>
</body>
</html>
